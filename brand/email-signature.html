<!--
  Nesh — Gmail signature.

  Built the way email actually renders rather than the way the site is built:
  nested tables, inline styles, explicit width and height on every image, and no
  web fonts. Gmail strips <style> blocks, Outlook renders through Word, and
  neither has ever heard of flexbox — so the markup here is deliberately old.

  Texture cannot be done in CSS in Gmail: blend modes, filters and gradients are
  all discarded, and background images are unreliable. So the texture arrives
  already baked into two pictures, generated by scripts/signature-art.swift with
  the same two-plate treatment the binder cover uses — red ground, photograph
  multiplied into it, screened back on top, grain over everything. The wordmark
  is a picture for the same reason: set as live text it would fall back to
  whatever heavy face the reader happens to own, and Anton cannot be loaded in
  mail at all.

  The contact details stay live HTML rather than joining the picture, so they
  remain selectable, clickable, and readable when a client blocks images — which
  Outlook and Gmail both do by default for unknown senders. Every image carries
  alt text styled to stand in for it.

  The ground is near-black rather than the site's red: a saturated red block the
  width of a reply reads as shouting in a thread and inverts badly in dark mode.
  The red is spent on the spine, the wordmark and the link instead.

  Assets live on Supabase, not on the site — a signature outlives any one deploy
  and mail clients cache the first thing they fetch.

  TO INSTALL: open this file in a browser, select the whole card, copy, then
  paste into Gmail → Settings → See all settings → Signature. Paste carries the
  formatting; you are not pasting code.
-->

  <tr>

      <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="470" style="border-collapse:collapse;width:470px;background-color:#100e0d;">
        <tr>
          <!-- Red spine: the one piece of flat colour on the card. -->
          <td width="6" style="width:6px;background-color:#e3251b;font-size:0;line-height:0;">&nbsp;</td>

          <!-- Portrait, treated like the cover. -->
          <td width="136" style="width:136px;padding:18px 0 18px 18px;vertical-align:top;">
            <img
              src="https://thvhgbrtyexhggjklmfh.supabase.co/storage/v1/object/public/portfolio/brand/sig-portrait.jpg"
              width="118"
              height="148"
              alt="Nesh"
              style="display:block;width:118px;height:148px;border:0;outline:none;text-decoration:none;"
            />
          </td>

          <!-- Details -->
          <td style="padding:20px 20px 20px 14px;vertical-align:top;font-family:Helvetica,Arial,sans-serif;">

            <!-- Wordmark. Alt text is styled so a blocked image still leaves a
                 name on the card rather than an empty box. -->
            <img
              src="https://thvhgbrtyexhggjklmfh.supabase.co/storage/v1/object/public/portfolio/brand/sig-wordmark.png"
              width="178"
              height="59"

            />

            <!-- Gold hairline, as on the cover. -->
            <div style="width:56px;height:3px;background-color:#e9a733;font-size:0;line-height:0;margin:4px 0 11px 0;">&nbsp;</div>

            <div style="font-family:Helvetica,Arial,sans-serif;font-size:12px;line-height:18px;color:#f2ede3;font-weight:bold;">

              <br />
              <a href="https://www.neshvideo.com" style="color:#e3251b;text-decoration:none;font-weight:bold;">www.neshvideo.com</a>
            </div>

          </td>
        </tr>
      </table>

</table>
